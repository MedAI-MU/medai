services:
  backend:
    container_name: medai-backend
    build:
      context: ../backend
      dockerfile: ../backend/docker/Dockerfile.local
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ../backend:/medai
      - backend-venv:/medai/.venv
    ports:
      - "8000:8000"
    env_file:
      - ../backend/.env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - medai-network

  db:
    container_name: medai-db
    image: postgres:16.10
    environment:
      POSTGRES_USER: ${DJANGO_DB_USER:-medai}
      POSTGRES_PASSWORD: ${DJANGO_DB_PASSWORD:-password}
      POSTGRES_DB: ${DJANGO_DB_NAME:-medai_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DJANGO_DB_USER:-medai} -d ${DJANGO_DB_NAME:-medai_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - medai-network

volumes:
  postgres_data:
  backend-venv:

networks:
  medai-network:
