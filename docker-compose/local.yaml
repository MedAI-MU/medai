services:
  backend:
    container_name: medai-backend
    build:
      context: ../backend
      dockerfile: ../backend/docker/Dockerfile.local
    # command: >
    #   sh -c "node "
    volumes:
      - backend-node_modules:/medai/node_modules
    ports:
      - 8080:8000
    env_file:
      - ../backend/.env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - medai-network

  db:
    container_name: medai-db
    image: postgres:16.10
    environment:
      POSTGRES_USER: ${DB_USERNAME:-medai}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-medai_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME:-medai} -d ${DB_NAME:-medai_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - medai-network

volumes:
  postgres_data:
  backend-node_modules:

networks:
  medai-network:
