# .github/workflows/pull-request-check.yml

name: Mobile PR Check & Test

on:
  # This workflow runs on any pull request targeting dev or staging
  push:
    branches:
      - staging
      - main
  merge_group:
  pull_request:
    branches:
      - dev
      - staging
    paths:
      - 'mobile/**'

jobs:
  android-test:
    # Use a standard Linux runner
    runs-on: ubuntu-latest
    steps:
      # Step 1: Get a copy of your code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up the Java environment required for building
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Step 3: Speed up future builds by caching dependencies
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: echo $GOOGLE_SERVICES_JSON_BASE64 | base64 --decode > mobile/MedAI/composeApp/google-services.json

      # Step 4: Give the Gradle wrapper permission to run
      - name: Make gradlew executable
        working-directory: ./mobile/MedAI
        run: chmod +x gradlew

      # Step 5: Run the unit tests ✅
      - name: Run Unit Tests
        working-directory: ./mobile/MedAI
        run: ./gradlew testDebugUnitTest

  # Job 2: Run iOS tests on a macOS machine
  ios-test:
    runs-on: macos-latest  # iOS tests must run on macOS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        working-directory: ./mobile/MedAI
        run: chmod +x gradlew

      - name: Run iOS Unit Tests
        working-directory: ./mobile/MedAI
        run: ./gradlew iosX64Test  # This is the command to run tests for iOS
