name: Mobile i18n Autofill (bot PR)

on:
  pull_request:
    branches: [dev]
    paths: ['mobile/**']

#on:
#  push:
#    branches:
#      - dev
#    paths:
#      - 'mobile/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  i18n-autofill:
    runs-on: ubuntu-latest

    steps:
      - name: Show diff
        run: git diff --stat

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # If your translate.py needs extra deps, keep a requirements.txt under mobile/MedAI
      - name: Install Python dependencies
        working-directory: ./mobile/MedAI
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install google-genai; fi

      # Only needed if your Gradle build needs google-services.json
      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > mobile/MedAI/composeApp/google-services.json

      - name: Make gradlew executable
        working-directory: ./mobile/MedAI
        run: chmod +x gradlew

      - name: Run translation autofill (Gemma)
        working-directory: ./mobile/MedAI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python translate.py \
            --mode apply \
            --locales es,de,ar \
            --model gemma-3-27b-it \
            --batch-size 15 \
            --request-delay 2

      # Validation: choose ONE of these approaches
      # Option A (fast): verify resources compile
      - name: Validate Android resources compile
        working-directory: ./mobile/MedAI
        run: ./gradlew :composeApp:processDebugResources

      # Option B (heavier): run unit tests (matches your PR check)
      # - name: Run Unit Tests
      #   working-directory: ./mobile/MedAI
      #   run: ./gradlew testDebugUnitTest

      - name: Create Pull Request with translations
        uses: peter-evans/create-pull-request@v6
        with:
          base: dev
          branch: bot/mobile-i18n-autofill
          delete-branch: true
          add-paths: |
            mobile/**
          commit-message: "chore(i18n): autofill missing translations (es,de,ar)"
          title: "chore(i18n): autofill missing translations (es,de,ar)"
          body: |
            This PR was auto-generated by the i18n autofill workflow.

            - Adds missing locale folders/files across modules
            - Fills missing keys using the translation script (Gemma)
            - Preserves placeholders and markup tokens

            Please review wording and formatting before merging.
