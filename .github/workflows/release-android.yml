name: Build and Release Android App

on:
  push:
    branches:
      - dev
    tags:
      - 'v*'
  pull_request:
    branches:
      - dev
      - staging
    paths:
      - 'mobile/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Upload APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: echo $GOOGLE_SERVICES_JSON_BASE64 | base64 --decode > mobile/MedAI/composeApp/google-services.json

      - name: Make gradlew executable
        working-directory: ./mobile/MedAI
        run: chmod +x gradlew

      # ----------------- Build Staging APK -----------------
      - name: Build Staging APK
        working-directory: ./mobile/MedAI
        env:
          MEDAI_BASE_URL: ${{ secrets.MEDAI_STAGING_BASE_URL }}
        run: ./gradlew assembleDebug

      - name: Rename and Move Staging APK
        run: |
          mkdir -p build-artifacts
          mv mobile/MedAI/composeApp/build/outputs/apk/debug/composeApp-debug.apk build-artifacts/medai-staging.apk

      # Clean to ensure config is refreshed and cached files are not reused incorrectly
      - name: Clean Gradle build
        working-directory: ./mobile/MedAI
        run: ./gradlew clean

      # ----------------- Build Production APK -----------------
      - name: Build Production APK
        working-directory: ./mobile/MedAI
        env:
          MEDAI_BASE_URL: ${{ secrets.MEDAI_PROD_BASE_URL }}
        run: ./gradlew assembleDebug

      - name: Rename and Move Production APK
        run: |
          mv mobile/MedAI/composeApp/build/outputs/apk/debug/composeApp-debug.apk build-artifacts/medai-production.apk

      # ----------------- Upload to GitHub Release -----------------
      - name: Create Release and Upload APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest-android' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'Latest Android Build' }}
          draft: false
          prerelease: false
          files: |
            build-artifacts/medai-staging.apk
            build-artifacts/medai-production.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ----------------- Output Release Links -----------------
      - name: Output Release Links
        id: release-links
        run: |
          TAG_NAME="${{ github.ref_type == 'tag' && github.ref_name || 'latest-android' }}"
          STAGING_URL="https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}/medai-staging.apk"
          PROD_URL="https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}/medai-production.apk"

          echo "STAGING_DOWNLOAD_URL=${STAGING_URL}" >> $GITHUB_ENV
          echo "PROD_DOWNLOAD_URL=${PROD_URL}" >> $GITHUB_ENV

          echo "staging_url=${STAGING_URL}" >> $GITHUB_OUTPUT
          echo "prod_url=${PROD_URL}" >> $GITHUB_OUTPUT

          echo "### 🚀 Android App Release Links" >> $GITHUB_STEP_SUMMARY
          echo "- **Staging APK:** [Download](${STAGING_URL})" >> $GITHUB_STEP_SUMMARY
          echo "- **Production APK:** [Download](${PROD_URL})" >> $GITHUB_STEP_SUMMARY

          echo "Staging Link: ${STAGING_URL}"
          echo "Production Link: ${PROD_URL}"

      # ----------------- Update GitHub Repository Variables -----------------
      - name: Update GitHub Repository Variables
        env:
          GH_TOKEN: ${{ secrets.VAR_UPDATE_TOKEN }}
        run: |
          if [ -n "$GH_TOKEN" ]; then
            TAG_NAME="${{ github.ref_type == 'tag' && github.ref_name || 'latest-android' }}"
            STAGING_URL="https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}/medai-staging.apk"
            PROD_URL="https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}/medai-production.apk"

            gh variable set ANDROID_STAGING_DOWNLOAD_URL --body "$STAGING_URL"
            gh variable set ANDROID_PROD_DOWNLOAD_URL --body "$PROD_URL"
            echo "Successfully updated repository variables ANDROID_STAGING_DOWNLOAD_URL and ANDROID_PROD_DOWNLOAD_URL!"
          else
            echo "Warning: VAR_UPDATE_TOKEN secret is not set. Skipping repository variable update."
          fi
