# .github/workflows/deploy-android.yml

name: Deploy Android to Firebase

on:
  push:
    branches:
      - dev
      - staging
    paths:
      - 'mobile/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # Decode and create the google-services.json file
      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: echo $GOOGLE_SERVICES_JSON_BASE64 | base64 --decode > mobile/MedAI/composeApp/google-services.json

      - name: Make gradlew executable
        working-directory: ./mobile/MedAI
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: ./mobile/MedAI
        run: ./gradlew assembleDebug

      # Deploy to DEV testers
      - name: Distribute to DEV Testers
        if: github.ref == 'refs/heads/dev'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          token: ${{ secrets.FIREBASE_CLI_TOKEN }}
          groups: dev-testers
          file: mobile/MedAI/composeApp/build/outputs/apk/debug/composeApp-debug.apk

      # Deploy to STAGING testers
      - name: Distribute to QA Team
        if: github.ref == 'refs/heads/staging'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          token: ${{ secrets.FIREBASE_CLI_TOKEN }}
          groups: qa-team
          file: mobile/MedAI/composeApp/build/outputs/apk/debug/composeApp-debug.apk
