name: Build and Deploy Container to Azure App Service

on:
  push:
    branches: ["staging", "feature/staging-workflow"]
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ secrets.ACR_LOGIN_SERVER }}/medai-staging

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build & Push Image to ACR
    runs-on: ubuntu-latest
    environment: azure-staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.IMAGE_NAME }}:latest \
            -f backend/docker/Dockerfile \
            backend

      - name: Push Docker image to ACR
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.IMAGE_NAME }}:latest

  deploy:
    name: Deploy to Azure App Service
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: azure-staging

    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy container to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          images: ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Azure logout
        if: always()
        run: az logout
