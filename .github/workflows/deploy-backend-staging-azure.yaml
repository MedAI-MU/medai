name: Build, Migrate and Deploy to Azure VM - Staging

on:
  push:
    branches: ["staging"]
  workflow_dispatch:

env:
  BACKEND_IMAGE_NAME: ${{ secrets.ACR_LOGIN_SERVER }}/medai-staging-backend
  FRONTEND_IMAGE_NAME: ${{ secrets.ACR_LOGIN_SERVER }}/medai-staging-frontend

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build & Push Images to ACR
    runs-on: ubuntu-latest
    environment: azure-staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker backend image
        uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/docker/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Docker frontend image
        uses: docker/build-push-action@v7
        with:
          context: frontend-next
          file: frontend-next/docker/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrate-database:
    name: Migrate Database
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: azure-staging

    steps:
      - name: Log in to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Pull image from ACR
        run: docker pull ${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}

      - name: Get GitHub runner public IP
        id: ip
        run: echo "ip=$(curl -s https://api.ipify.org)" >> $GITHUB_OUTPUT

      - name: Allow runner IP on database firewall
        uses: azure/cli@v2
        with:
          azcliversion: 2.85.0
          inlineScript: |
            az postgres flexible-server firewall-rule create \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --name ${{ secrets.DB_SERVER_NAME }} \
              --rule-name github-actions-runner \
              --start-ip-address ${{ steps.ip.outputs.ip }} \
              --end-ip-address ${{ steps.ip.outputs.ip }}

      - name: Run database migrations
        run: |
          docker run --rm \
          -e DB_NAME=${{ secrets.DB_NAME}} \
          -e DB_USERNAME=${{ secrets.DB_USERNAME}} \
          -e DB_PASSWORD=${{ secrets.DB_PASSWORD}} \
          -e DB_HOST=${{ secrets.DB_HOST }} \
          -e DB_PORT=${{ secrets.DB_PORT }} \
          -e DB_SSL=${{ secrets.DB_SSL }} \
          ${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }} \
          node_modules/.bin/typeorm migration:run -d dist/typeorm.data-source.js

      - name: Remove runner IP from database firewall
        if: always()
        uses: azure/cli@v2
        with:
          azcliversion: 2.85.0
          inlineScript: |
            az postgres flexible-server firewall-rule delete \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --name ${{ secrets.DB_SERVER_NAME }} \
              --rule-name github-actions-runner \
              --yes

      - name: Azure logout
        if: always()
        run: az logout

  deploy-to-azure:
    name: Deploy to Azure VM
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: azure-staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Copy compose file
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: azureuser
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          source: docker-compose/staging.yaml
          target: /home/azureuser/medai/

      - name: SSH and deploy
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VM_HOST }}
          username: azureuser
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          script: |
            cd /home/azureuser/medai
            docker compose pull
            docker-compose -f docker-compose/staging.yaml up -d
            docker image prune -f
