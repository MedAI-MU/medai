name: Backend Tests
on:
  # This workflow runs on any pull request targeting dev or staging
  push:
    branches:
      - staging
      - main
  merge_group:
  pull_request:
    branches:
      - dev
      - staging
    paths:
      - 'backend/**'

jobs:
  backend-test:
    name: Run backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          cache-from: type=gha
          cache-to: type=gha,mode=max
          context: backend
          file: backend/docker/Dockerfile.test
          load: true
          tags: backend-test:latest

      - name: Run backend tests
        run: |
          docker run --rm backend-test:latest pnpm test:cov
